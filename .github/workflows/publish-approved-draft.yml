name: Valider et publier un brouillon

on:
  workflow_dispatch:
    inputs:
      draft_path:
        description: "Chemin exact sous content/drafts/"
        required: true
        type: string
      confirmation:
        description: "Choisir PUBLIER pour confirmer"
        required: true
        type: choice
        options:
          - ANNULER
          - PUBLIER

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLIER' }}
    runs-on: ubuntu-latest
    env:
      APPROVED_DRAFT: ${{ inputs.draft_path }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publier uniquement le brouillon validé
        run: python scripts/publish_draft.py --draft "$APPROVED_DRAFT"

      - name: Mettre à jour sitemap et RSS
        run: python scripts/generate_discovery_feeds.py

      - name: Enregistrer la publication
        run: |
          git config user.name "elan-pour-tous-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/publications pages/blog.html content/published content/drafts sitemap.xml rss.xml
          git diff --cached --quiet && exit 1 || true
          git commit -m "Publication validée : mise en ligne et flux de découverte"
          git push

      - name: Résumé
        run: |
          echo "### Publication effectuée" >> "$GITHUB_STEP_SUMMARY"
          echo "Page créée, ajoutée à Ressources, archivée et intégrée au sitemap et au flux RSS sans service Google." >> "$GITHUB_STEP_SUMMARY"
